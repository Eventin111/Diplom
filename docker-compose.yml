services:
  frontend:
    platform: linux/amd64
    image: ${FRONTEND_IMAGE:-swipeit-frontend:local}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_NAME: ${FRONTEND_APP_NAME:-Swipelt}
        REACT_APP_API_BASE_URL: ${FRONTEND_REACT_APP_API_BASE_URL:-}
        REACT_APP_TRYON_MAX_PROCESSING_SECONDS: ${FRONTEND_TRYON_MAX_PROCESSING_SECONDS:-600}
        REACT_APP_USE_MOCK_DATA: ${FRONTEND_USE_MOCK_DATA:-false}
        REACT_APP_MOCK_DELAY_MS: ${FRONTEND_MOCK_DELAY_MS:-0}
        REACT_APP_AUTH_INIT_DELAY_MS: ${FRONTEND_AUTH_INIT_DELAY_MS:-300}
    restart: unless-stopped
    ports:
      - "${FRONTEND_HOST_PORT:-80}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      backend:
        condition: service_healthy

  backend:
    platform: linux/amd64
    image: ${BACKEND_IMAGE:-swipeit-backend:local}
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    command: python backend/run_server.py
    ports:
      - "8000:8000"
    environment:
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      DB_URL: ${DOCKER_DB_URL:-postgresql://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-swipeit}}
      ML_DEVICE: ${ML_DEVICE:-cpu}
      S3_ENDPOINT: ${DOCKER_S3_ENDPOINT:-http://minio:9000}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-swipeit-media}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_SECURE: ${S3_SECURE:-false}
      REDIS_URL: ${DOCKER_REDIS_URL:-redis://redis:6379/0}
      TRYON_REQUIRE_CUDA: ${TRYON_REQUIRE_CUDA:-false}
      TRYON_WORKER_HEARTBEAT_TTL_SECONDS: ${TRYON_WORKER_HEARTBEAT_TTL_SECONDS:-30}
      TRYON_RECOVERY_INTERVAL_SECONDS: ${TRYON_RECOVERY_INTERVAL_SECONDS:-60}
      TRYON_STALE_PROCESSING_THRESHOLD_SECONDS: ${TRYON_STALE_PROCESSING_THRESHOLD_SECONDS:-600}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/live', timeout=3)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
    volumes:
      - ./ml/checkpoints:/app/ml/checkpoints:ro
      - ./ml/checkpoints:/app/ml/third_party/checkpoints:ro

  tryon-worker:
    platform: linux/amd64
    image: ${TRYON_WORKER_IMAGE:-swipeit-backend:local}
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    command: python backend/run_tryon_worker.py
    environment:
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      DB_URL: ${DOCKER_DB_URL:-postgresql://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-swipeit}}
      ML_DEVICE: ${ML_DEVICE:-cpu}
      S3_ENDPOINT: ${DOCKER_S3_ENDPOINT:-http://minio:9000}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-swipeit-media}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_SECURE: ${S3_SECURE:-false}
      REDIS_URL: ${DOCKER_REDIS_URL:-redis://redis:6379/0}
      TRYON_REQUIRE_CUDA: ${TRYON_REQUIRE_CUDA:-false}
      TRYON_WORKER_HEARTBEAT_TTL_SECONDS: ${TRYON_WORKER_HEARTBEAT_TTL_SECONDS:-30}
      TRYON_RECOVERY_INTERVAL_SECONDS: ${TRYON_RECOVERY_INTERVAL_SECONDS:-60}
      TRYON_STALE_PROCESSING_THRESHOLD_SECONDS: ${TRYON_STALE_PROCESSING_THRESHOLD_SECONDS:-600}
      OMP_NUM_THREADS: ${TRYON_OMP_NUM_THREADS:-2}
      OPENBLAS_NUM_THREADS: ${TRYON_OPENBLAS_NUM_THREADS:-2}
      MKL_NUM_THREADS: ${TRYON_MKL_NUM_THREADS:-2}
      NUMEXPR_NUM_THREADS: ${TRYON_NUMEXPR_NUM_THREADS:-2}
      TORCH_NUM_THREADS: ${TRYON_TORCH_NUM_THREADS:-2}
      TORCH_NUM_INTEROP_THREADS: ${TRYON_TORCH_NUM_INTEROP_THREADS:-1}
      PYTORCH_CUDA_ALLOC_CONF: ${PYTORCH_CUDA_ALLOC_CONF:-max_split_size_mb:64,garbage_collection_threshold:0.8}
      PYTORCH_NO_CUDA_MEMORY_CACHING: ${PYTORCH_NO_CUDA_MEMORY_CACHING:-1}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./ml/checkpoints:/app/ml/checkpoints:ro
      - ./ml/checkpoints:/app/ml/third_party/checkpoints:ro

  postgres:
    platform: linux/amd64
    image: postgres:15
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-swipeit}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 3

  minio:
    platform: linux/amd64
    image: minio/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  redis:
    platform: linux/amd64
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  minio_data:
  redis_data:
