services:
  backend:
    platform: linux/amd64
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: python backend/run_server.py
    ports:
      - "8000:8000"
    environment:
      SECRET_KEY: swipeit-gon-make-it
      DB_URL: postgresql://postgres:swipeit-gon-make-it@postgres:5432/swipeit
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET_NAME: swipeit-media
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin123
      S3_REGION: us-east-1
      S3_SECURE: "false"
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_started

  tryon-worker:
    platform: linux/amd64
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: python backend/run_tryon_worker.py
    environment:
      SECRET_KEY: swipeit-gon-make-it
      DB_URL: postgresql://postgres:swipeit-gon-make-it@postgres:5432/swipeit
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET_NAME: swipeit-media
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin123
      S3_REGION: us-east-1
      S3_SECURE: "false"
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    platform: linux/amd64
    image: postgres:15
    environment:
      POSTGRES_DB: swipeit
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: swipeit-gon-make-it
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 3

  minio:
    platform: linux/amd64
    image: minio/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  redis:
    platform: linux/amd64
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  minio_data:
  redis_data:
