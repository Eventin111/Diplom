[project]
name = "swipeit-backend-service"
version = "0.1.0"
description = "SwipeIt backend + try-on worker service"
requires-python = "==3.10.*"
dependencies = [
  "fastapi==0.104.1",
  "uvicorn[standard]==0.24.0",
  "sqlalchemy[asyncio]==2.0.23",
  "asyncpg==0.29.0",
  "alembic==1.12.1",
  "pydantic==1.10.13",
  "python-jose[cryptography]==3.3.0",
  "passlib[bcrypt]==1.7.4",
  "python-multipart==0.0.6",
  "python-dotenv==1.0.0",
  "email-validator==2.0.0",
  "redis==5.0.1",
  "boto3==1.34.0",
  "pillow==10.4.0",
]

[dependency-groups]
ml = [
  "numpy==1.24.4",
  "scipy==1.10.1",
  "scikit-image==0.21.0",
  "opencv-python==4.7.0.72",
  "diffusers==0.24.0",
  "transformers==4.36.2",
  "accelerate==0.26.1",
  "matplotlib==3.7.4",
  "tqdm==4.64.1",
  "gradio==3.50.2",
  "einops==0.7.0",
  "onnxruntime==1.16.2",
  "huggingface_hub==0.19.4",
  "torch==2.0.1",
  "torchvision==0.15.2",
]
dev = [
  "black==24.10.0",
  "isort==5.13.2",
  "flake8==7.1.1",
  "pylint==3.3.1",
  "mypy==1.13.0",
  "pytest==8.3.2",
  "pytest-cov==5.0.0",
]

[tool.uv]
package = false

[tool.black]
line-length = 120
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 120
py_version = 310
src_paths = ["app", "alembic", "."]

[tool.mypy]
python_version = "3.10"
files = [
  "app/main.py",
  "alembic/env.py",
  "run_server.py",
  "run_migrations.py",
  "run_tryon_worker.py",
]
ignore_missing_imports = true
follow_imports = "skip"
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = false

[tool.pylint.main]
py-version = "3.10"
jobs = 1

[tool.pylint.format]
max-line-length = 120

[tool.pylint.messages_control]
disable = [
  "missing-module-docstring",
  "missing-function-docstring",
  "missing-class-docstring",
  "wrong-import-position",
  "broad-exception-caught",
  "broad-exception-raised",
  "duplicate-code",
  "too-many-arguments",
  "too-many-locals",
  "too-many-branches",
  "too-many-statements",
  "too-many-return-statements",
  "too-few-public-methods",
  "no-name-in-module",
]
