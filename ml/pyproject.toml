[tool.black]
line-length = 120
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 120
py_version = 310
src_paths = ["swipeit_ml", "scripts", "tests"]

[tool.mypy]
python_version = "3.10"
files = ["swipeit_ml", "scripts"]
ignore_missing_imports = true
follow_imports = "skip"
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = false

[tool.pylint.main]
py-version = "3.10"
jobs = 1
persistent = false

[tool.pylint.format]
max-line-length = 120

[tool.pylint.messages_control]
disable = [
  "missing-module-docstring",
  "missing-function-docstring",
  "missing-class-docstring",
  "wrong-import-position",
  "import-outside-toplevel",
  "import-error",
  "global-statement",
  "invalid-name",
  "duplicate-code",
  "too-many-arguments",
  "too-many-positional-arguments",
  "too-many-locals",
  "too-many-branches",
  "too-many-statements",
  "too-few-public-methods",
  "too-many-instance-attributes",
  "line-too-long",
  "redefined-outer-name",
  "unused-argument",
  "unused-variable",
  "broad-exception-caught",
  "unnecessary-dunder-call",
  "unnecessary-lambda",
  "consider-using-from-import",
  "use-maxsplit-arg",
  "consider-using-enumerate",
  "consider-using-in",
  "reimported",
]
