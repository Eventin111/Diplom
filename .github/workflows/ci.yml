name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  ml-tests:
    name: ML Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: ml/requirements-test.txt

      - name: Install ML test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Run ML tests with coverage
        run: >
          python -m pytest tests/unit tests/integration
          --cov=swipeit_ml
          --cov-report=term-missing
          --cov-report=html:htmlcov
          --cov-report=xml:coverage.xml
          --cov-fail-under=70

      - name: Upload ML coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ml-coverage-report
          path: |
            ml/coverage.xml
            ml/htmlcov
          if-no-files-found: warn

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: backend/requirements-test.txt

      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Run backend tests with coverage
        run: >
          python -m pytest
          --cov=app
          --cov-config=.coveragerc
          --cov-report=term-missing
          --cov-report=html:htmlcov
          --cov-report=xml:coverage.xml

      - name: Upload backend coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: |
            backend/coverage.xml
            backend/htmlcov
          if-no-files-found: warn

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend unit tests with coverage
        run: >
          npm run test:coverage -- --watch=false
          --coverageReporters=text
          --coverageReporters=html
          --coverageReporters=lcov
          --coverageReporters=cobertura
          --coverageReporters=json-summary

      - name: Upload frontend coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-report
          path: frontend/coverage
          if-no-files-found: warn

      - name: Build frontend
        run: npm run build

  coverage-summary:
    name: Coverage Summary
    runs-on: ubuntu-latest
    if: always()
    needs:
      - ml-tests
      - backend-tests
      - frontend-tests
    steps:
      - name: Download backend coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-coverage-report
          path: artifacts/backend

      - name: Download frontend coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage-report
          path: artifacts/frontend

      - name: Download ML coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: ml-coverage-report
          path: artifacts/ml

      - name: Publish coverage summary
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          import xml.etree.ElementTree as ET

          def find_one(root: str, name: str):
              matches = list(pathlib.Path(root).rglob(name))
              return matches[0] if matches else None

          def read_xml_rate(path: pathlib.Path):
              if not path or not path.exists():
                  return None
              root = ET.parse(path).getroot()
              rate = root.attrib.get("line-rate")
              if rate is None:
                  return None
              return round(float(rate) * 100, 2)

          def read_frontend_lines(path: pathlib.Path):
              if not path or not path.exists():
                  return None
              payload = json.loads(path.read_text())
              total = payload.get("total", {})
              lines = total.get("lines", {})
              pct = lines.get("pct")
              return round(float(pct), 2) if pct is not None else None

          backend_pct = read_xml_rate(find_one("artifacts/backend", "coverage.xml"))
          ml_pct = read_xml_rate(find_one("artifacts/ml", "coverage.xml"))
          frontend_pct = read_frontend_lines(find_one("artifacts/frontend", "coverage-summary.json"))

          rows = [
              ("Backend", backend_pct, "backend-coverage-report"),
              ("Frontend", frontend_pct, "frontend-coverage-report"),
              ("ML", ml_pct, "ml-coverage-report"),
          ]

          lines = [
              "# Coverage Summary",
              "",
              "| Section | Coverage | Artifact |",
              "| --- | ---: | --- |",
          ]
          for name, pct, artifact in rows:
              rendered = f"{pct:.2f}%" if pct is not None else "n/a"
              lines.append(f"| {name} | {rendered} | `{artifact}` |")

          lines.extend(
              [
                  "",
                  "Artifacts include machine-readable reports and HTML coverage output where available.",
                  "Download them from this workflow run to inspect detailed uncovered lines.",
              ]
          )

          summary_path = os.environ["GITHUB_STEP_SUMMARY"]
          with open(summary_path, "a", encoding="utf-8") as handle:
              handle.write("\n".join(lines) + "\n")
          PY
