name: Deploy Backend (Push Model)

on:
  push:
    branches:
      - main
      - Frontend-Backend-ML
    paths:
      - "backend/**"
      - "docker-compose.yml"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build and Push Backend Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/eventin111/diplom-backend
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    name: Deploy to Remote Server
    runs-on: ubuntu-latest
    needs:
      - build-and-push
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_REF: ghcr.io/eventin111/diplom-backend:sha-${{ github.sha }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
          MINIO_ROOT_USER: ${{ secrets.MINIO_ROOT_USER }}
          MINIO_ROOT_PASSWORD: ${{ secrets.MINIO_ROOT_PASSWORD }}
          DOCKER_DB_URL: ${{ secrets.DOCKER_DB_URL }}
          DOCKER_S3_ENDPOINT: ${{ secrets.DOCKER_S3_ENDPOINT }}
          DOCKER_REDIS_URL: ${{ secrets.DOCKER_REDIS_URL }}
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
          S3_REGION: ${{ secrets.S3_REGION }}
          S3_SECURE: ${{ secrets.S3_SECURE }}
          ML_DEVICE: ${{ secrets.ML_DEVICE }}
          TRYON_REQUIRE_CUDA: ${{ secrets.TRYON_REQUIRE_CUDA }}
          FRONTEND_HOST_PORT: ${{ secrets.FRONTEND_HOST_PORT }}
          POSTGRES_HOST_PORT: ${{ secrets.POSTGRES_HOST_PORT }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          passphrase: ${{ secrets.DEPLOY_SSH_PASSPHRASE }}
          port: ${{ secrets.DEPLOY_PORT != '' && secrets.DEPLOY_PORT || '22' }}
          envs: IMAGE_REF,DEPLOY_PATH,GHCR_USERNAME,GHCR_READ_TOKEN,SECRET_KEY,POSTGRES_PASSWORD,S3_ACCESS_KEY,S3_SECRET_KEY,MINIO_ROOT_USER,MINIO_ROOT_PASSWORD,DOCKER_DB_URL,DOCKER_S3_ENDPOINT,DOCKER_REDIS_URL,S3_BUCKET_NAME,S3_REGION,S3_SECURE,ML_DEVICE,TRYON_REQUIRE_CUDA,FRONTEND_HOST_PORT,POSTGRES_HOST_PORT,POSTGRES_DB,POSTGRES_USER
          script: |
            set -e
            cd "$DEPLOY_PATH"
            umask 077
            cat > .env <<EOF
            SECRET_KEY=$SECRET_KEY
            POSTGRES_PASSWORD=$POSTGRES_PASSWORD
            S3_ACCESS_KEY=$S3_ACCESS_KEY
            S3_SECRET_KEY=$S3_SECRET_KEY
            MINIO_ROOT_USER=$MINIO_ROOT_USER
            MINIO_ROOT_PASSWORD=$MINIO_ROOT_PASSWORD
            DOCKER_DB_URL=${DOCKER_DB_URL:-}
            DOCKER_S3_ENDPOINT=${DOCKER_S3_ENDPOINT:-}
            DOCKER_REDIS_URL=${DOCKER_REDIS_URL:-}
            S3_BUCKET_NAME=${S3_BUCKET_NAME:-swipeit-media}
            S3_REGION=${S3_REGION:-us-east-1}
            S3_SECURE=${S3_SECURE:-false}
            ML_DEVICE=${ML_DEVICE:-cpu}
            TRYON_REQUIRE_CUDA=${TRYON_REQUIRE_CUDA:-false}
            FRONTEND_HOST_PORT=${FRONTEND_HOST_PORT:-80}
            POSTGRES_HOST_PORT=${POSTGRES_HOST_PORT:-5433}
            POSTGRES_DB=${POSTGRES_DB:-swipeit}
            POSTGRES_USER=${POSTGRES_USER:-postgres}
            EOF
            echo "$GHCR_READ_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
            export BACKEND_IMAGE="$IMAGE_REF"
            docker compose pull backend
            docker compose up -d --no-build backend
            docker image prune -f
