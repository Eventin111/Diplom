services:
  airflow-init:
    image: apache/airflow:2.9.3
    user: "${AIRFLOW_UID:-50000}:0"
    environment:
      AIRFLOW_UID: "50000"
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      _PIP_ADDITIONAL_REQUIREMENTS: ${AIRFLOW_PIP_ADDITIONAL_REQUIREMENTS-}
      AIRFLOW_ADMIN_USERNAME: ${AIRFLOW_ADMIN_USERNAME:-admin}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?Set AIRFLOW_ADMIN_PASSWORD in your environment or .env file}
      AIRFLOW_ADMIN_FIRSTNAME: ${AIRFLOW_ADMIN_FIRSTNAME:-Air}
      AIRFLOW_ADMIN_LASTNAME: ${AIRFLOW_ADMIN_LASTNAME:-Flow}
      AIRFLOW_ADMIN_EMAIL: ${AIRFLOW_ADMIN_EMAIL:-admin@example.com}
    volumes:
      - airflow_data:/opt/airflow
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - /var/run/docker.sock:/var/run/docker.sock
    command: >
      bash -c "
      airflow db migrate &&
      (airflow users create
      --username $$AIRFLOW_ADMIN_USERNAME
      --password $$AIRFLOW_ADMIN_PASSWORD
      --firstname $$AIRFLOW_ADMIN_FIRSTNAME
      --lastname $$AIRFLOW_ADMIN_LASTNAME
      --role Admin
      --email $$AIRFLOW_ADMIN_EMAIL || true)
      "

  airflow-webserver:
    image: apache/airflow:2.9.3
    user: "${AIRFLOW_UID:-50000}:0"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__WEB_SERVER_PORT: "8080"
      _PIP_ADDITIONAL_REQUIREMENTS: ${AIRFLOW_PIP_ADDITIONAL_REQUIREMENTS-}
      AIRFLOW__SECRETS__BACKEND: airflow.secrets.environment_variables.EnvironmentVariablesBackend
      SWIPEIT_BATCH_IMAGE: ${SWIPEIT_BATCH_IMAGE:-swipeit-batch:latest}
      SWIPEIT_DOCKER_NETWORK: ${SWIPEIT_DOCKER_NETWORK:-diplom_default}
      SWIPEIT_BATCH_DB_CONN_ID: ${SWIPEIT_BATCH_DB_CONN_ID:-swipeit_batch_db}
      BATCH_DB_URL: ${BATCH_DB_URL:-}
      AIRFLOW_CONN_SWIPEIT_BATCH_DB: ${AIRFLOW_CONN_SWIPEIT_BATCH_DB:-}
      TRYON_INTERRUPTED_STATUSES: ${TRYON_INTERRUPTED_STATUSES:-failed}
      SWIPEIT_DAG_SCHEDULE: ${SWIPEIT_DAG_SCHEDULE:-0 2 * * *}
      SWIPEIT_DAG_CATCHUP: ${SWIPEIT_DAG_CATCHUP:-true}
      SWIPEIT_DAG_RETRIES: ${SWIPEIT_DAG_RETRIES:-2}
      SWIPEIT_DAG_RETRY_DELAY_MINUTES: ${SWIPEIT_DAG_RETRY_DELAY_MINUTES:-5}
      SWIPEIT_TASK_TIMEOUT_MINUTES: ${SWIPEIT_TASK_TIMEOUT_MINUTES:-30}
      SWIPEIT_DAGRUN_TIMEOUT_MINUTES: ${SWIPEIT_DAGRUN_TIMEOUT_MINUTES:-60}
      SWIPEIT_MAX_ACTIVE_RUNS: ${SWIPEIT_MAX_ACTIVE_RUNS:-1}
      SWIPEIT_MAX_ACTIVE_TASKS: ${SWIPEIT_MAX_ACTIVE_TASKS:-2}
    volumes:
      - airflow_data:/opt/airflow
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - /var/run/docker.sock:/var/run/docker.sock
    command: webserver

  airflow-scheduler:
    image: apache/airflow:2.9.3
    user: "${AIRFLOW_UID:-50000}:0"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      _PIP_ADDITIONAL_REQUIREMENTS: ${AIRFLOW_PIP_ADDITIONAL_REQUIREMENTS-}
      AIRFLOW__SECRETS__BACKEND: airflow.secrets.environment_variables.EnvironmentVariablesBackend
      SWIPEIT_BATCH_IMAGE: ${SWIPEIT_BATCH_IMAGE:-swipeit-batch:latest}
      SWIPEIT_DOCKER_NETWORK: ${SWIPEIT_DOCKER_NETWORK:-diplom_default}
      SWIPEIT_BATCH_DB_CONN_ID: ${SWIPEIT_BATCH_DB_CONN_ID:-swipeit_batch_db}
      BATCH_DB_URL: ${BATCH_DB_URL:-}
      AIRFLOW_CONN_SWIPEIT_BATCH_DB: ${AIRFLOW_CONN_SWIPEIT_BATCH_DB:-}
      TRYON_INTERRUPTED_STATUSES: ${TRYON_INTERRUPTED_STATUSES:-failed}
      SWIPEIT_DAG_SCHEDULE: ${SWIPEIT_DAG_SCHEDULE:-0 2 * * *}
      SWIPEIT_DAG_CATCHUP: ${SWIPEIT_DAG_CATCHUP:-true}
      SWIPEIT_DAG_RETRIES: ${SWIPEIT_DAG_RETRIES:-2}
      SWIPEIT_DAG_RETRY_DELAY_MINUTES: ${SWIPEIT_DAG_RETRY_DELAY_MINUTES:-5}
      SWIPEIT_TASK_TIMEOUT_MINUTES: ${SWIPEIT_TASK_TIMEOUT_MINUTES:-30}
      SWIPEIT_DAGRUN_TIMEOUT_MINUTES: ${SWIPEIT_DAGRUN_TIMEOUT_MINUTES:-60}
      SWIPEIT_MAX_ACTIVE_RUNS: ${SWIPEIT_MAX_ACTIVE_RUNS:-1}
      SWIPEIT_MAX_ACTIVE_TASKS: ${SWIPEIT_MAX_ACTIVE_TASKS:-2}
    volumes:
      - airflow_data:/opt/airflow
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - /var/run/docker.sock:/var/run/docker.sock
    command: scheduler

volumes:
  airflow_data:
