services:
  airflow-init:
    image: apache/airflow:2.9.3
    user: "50000:0"
    environment:
      AIRFLOW_UID: "50000"
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      _PIP_ADDITIONAL_REQUIREMENTS: apache-airflow-providers-docker==3.11.0
    volumes:
      - airflow_data:/opt/airflow
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - /var/run/docker.sock:/var/run/docker.sock
    command: >
      bash -c "
      airflow db migrate &&
      (airflow users create
      --username admin
      --password admin
      --firstname Air
      --lastname Flow
      --role Admin
      --email admin@example.com || true)
      "

  airflow-webserver:
    image: apache/airflow:2.9.3
    user: "50000:0"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__WEB_SERVER_PORT: "8080"
      _PIP_ADDITIONAL_REQUIREMENTS: apache-airflow-providers-docker==3.11.0
      SWIPEIT_BATCH_IMAGE: swipeit-batch:latest
      SWIPEIT_DOCKER_NETWORK: diplom_default
      BATCH_DB_URL: postgresql://postgres:swipeit-gon-make-it@postgres:5432/swipeit
    volumes:
      - airflow_data:/opt/airflow
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - /var/run/docker.sock:/var/run/docker.sock
    command: webserver

  airflow-scheduler:
    image: apache/airflow:2.9.3
    user: "50000:0"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      _PIP_ADDITIONAL_REQUIREMENTS: apache-airflow-providers-docker==3.11.0
      SWIPEIT_BATCH_IMAGE: swipeit-batch:latest
      SWIPEIT_DOCKER_NETWORK: diplom_default
      BATCH_DB_URL: postgresql://postgres:swipeit-gon-make-it@postgres:5432/swipeit
    volumes:
      - airflow_data:/opt/airflow
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - /var/run/docker.sock:/var/run/docker.sock
    command: scheduler

volumes:
  airflow_data:
